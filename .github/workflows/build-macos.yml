name: Build macOS app

on:
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  push:
    tags: ['v*']            # ou automatiquement sur un tag v1.0, v3.0, ...

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .app
        run: pyinstaller --windowed --name Maxima2TexPDF mac2texpdf3-eng-mac.py

      - name: Zip the .app (keeps permissions)
        run: |
          cd dist
          ditto -c -k --keepParent Maxima2TexPDF.app Maxima2TexPDF-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maxima2TexPDF-macos
          path: dist/Maxima2TexPDF-macos.zip
