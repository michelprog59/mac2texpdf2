name: Build Windows Executable (French Version)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mac2texpdf2-w.py'
      - '.github/workflows/build-windows-fr.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-fr:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build Windows executable with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name mac2texpdf2-w mac2texpdf2-w.py
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: mac2texpdf2-windows-exe-fr
        path: dist/mac2texpdf2-w.exe
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/mac2texpdf2-w.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
