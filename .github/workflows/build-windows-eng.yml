name: Build Windows executable (English)

on:
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions
  push:
    branches: [ main ]
    paths:
      - 'mac2texpdf4-eng-w.py'
      - '.github/workflows/build-windows-eng.yml'

jobs:
  build-windows-eng:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Nuitka
        run: python -m pip install --upgrade pip nuitka

      - name: Build with Nuitka
        run: >
          python -m nuitka
          --onefile
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --assume-yes-for-downloads
          --output-dir=build
          --output-filename=mac2texpdf4-eng-w.exe
          mac2texpdf4-eng-w.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mac2texpdf4-eng-w
          path: build/mac2texpdf4-eng-w.exe
          if-no-files-found: error
